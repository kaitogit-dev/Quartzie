name: Verify Quartzie ISO
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and run regressions
        run: make verify -j2
      - name: Build persistent disk
        run: make Quartzie-0.31-disk.img
      - name: Upload ISO, disk and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quartzie-0.31-v86-test-build
          if-no-files-found: warn
          path: |
            Quartzie-0.31.iso
            Quartzie-0.31-disk.img
            build/kernel.elf
