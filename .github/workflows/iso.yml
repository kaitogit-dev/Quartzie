name: Build Quartzie x64
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld xorriso ovmf qemu-system-x86 fonts-inter python3-pil
      - name: Build and verify
        run: make verify
      - name: Boot ISO in OVMF
        run: python3 tools/bootcheck.py Quartzie-x64.iso iso
      - name: Boot GPT image in OVMF
        run: python3 tools/bootcheck.py Quartzie-x64-uefi.img disk
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quartzie-x64-UEFI
          if-no-files-found: error
          compression-level: 9
          path: |
            Quartzie-x64.iso
            Quartzie-x64-uefi.img
            build/BOOTX64.EFI
            build/*-screen.ppm
