name: Build Quartzie x64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Export icon sources
        uses: actions/upload-artifact@v4
        with:
          name: quartzie-icon-sources
          path: assets/icons.zip
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld xorriso ovmf qemu-system-x86 fonts-inter python3-pil
      - name: Repair icon archive
        run: |
          python3 tools/clean_icons.py
          if ! git diff --quiet -- assets/icons.zip; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/icons.zip
            git commit -m "Clean icons"
            git push origin HEAD:main
          fi
      - name: Build and verify
        run: make verify
      - name: Boot ISO in OVMF
        run: python3 tools/bootcheck.py Quartzie-x64.iso iso
      - name: Verify PS2 pointer movement
        run: python3 tools/mousecheck.py Quartzie-x64.iso
      - name: Verify USB tablet movement
        run: python3 tools/mousecheck.py Quartzie-x64.iso usb
      - name: Boot GPT image in OVMF
        run: python3 tools/bootcheck.py Quartzie-x64-uefi.img disk
      - name: Version builds
        run: make release
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quartzie-0.39.1-x64-UEFI
          if-no-files-found: error
          compression-level: 9
          path: |
            Quartzie-0.39.1-x64.iso
            Quartzie-0.39.1-x64.img
            build/BOOTX64.EFI
            build/Quartzie.cur
            assets/icons.zip
            build/*-screen.ppm
            build/settings.ppm
